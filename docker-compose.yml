# ==============================================================================
# OENEXA Non-Custodial Wallet Service — Standalone Stack
# ==============================================================================

version: "3.8"

services:
  oenexa-wallet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oenexa-wallet-standalone
    ports:
      - "8089:8089"
    environment:
      PORT: "8089"
      NODE_ENV: production
      OENEXA_RPC_URL: ${OENEXA_RPC_URL:-http://localhost:8545}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8089/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
